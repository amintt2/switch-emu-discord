<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Switch EMU</title>
</head>
<body>
  <div id="app">
    <header>
      <h1>Switch EMU<span id="jeu-en-cours"></span></h1>
      <div class="outils">
        <button id="stats" class="stats" type="button" title="Menu debug : images par seconde, pings, latence" hidden></button>
        <button id="bouton-debug" class="secondaire petit" type="button" title="Menu debug">Debug</button>
      </div>
    </header>
    <main>
      <section id="scene">
        <canvas id="ecran" width="1280" height="720"></canvas>
        <div id="voile"><div class="message" id="message">Connexion…</div></div>
        <div id="bandeau" role="status" hidden></div>
        <div class="boutons-scene">
          <button id="bouton-son" class="petit" type="button" title="Le navigateur attend un clic pour jouer le son" hidden>Activer le son</button>
          <button id="bouton-tactile" class="secondaire petit" type="button" title="Afficher ou cacher la manette tactile" hidden>Manette tactile</button>
          <button id="bouton-navigateur" class="secondaire petit" type="button" title="Ouvre la partie dans ton navigateur (plein écran avec F11)" hidden>Ouvrir dans le navigateur</button>
          <button id="bouton-grand" class="secondaire petit" type="button" title="Plein écran (ou double-clic sur la vidéo)">Plein écran</button>
        </div>
      </section>
      <aside id="panneau">
        <section id="bloc-places" hidden>
          <h2>Joueurs</h2>
          <ul id="places"></ul>
        </section>
        <h2>Dans la salle</h2>
        <ul id="participants"></ul>
        <div id="actions"></div>
      </aside>
    </main>
    <div id="toast" role="status" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
