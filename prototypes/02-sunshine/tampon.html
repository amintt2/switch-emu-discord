<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tampon latence</title>
<style>
  body { margin: 0; background: #222; color: #ccc; font: 16px system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; }
  p { margin: 60px 16px; }
</style>
</head>
<body>
<canvas id="stamp"></canvas>
<p>Tampon horaire pour mesurer la latence de Sunshine. Laisse cette fenêtre visible.</p>
<script>
// [rouge][bleu][16 bits de (Date.now() & 0xffff)] : l'horloge système est commune à toutes les pages,
// donc la page qui affiche le flux peut relire le tampon et calculer l'âge de l'image.
const B = 24, BITS = 16;
const c = document.getElementById('stamp');
c.width = (BITS + 2) * B; c.height = B;
c.style.width = c.width / devicePixelRatio + 'px';
c.style.height = c.height / devicePixelRatio + 'px';
const x = c.getContext('2d');
(function draw() {
  const code = Date.now() & 0xffff;
  x.fillStyle = '#f00'; x.fillRect(0, 0, B, B);
  x.fillStyle = '#00f'; x.fillRect(B, 0, B, B);
  for (let i = 0; i < BITS; i++) {
    x.fillStyle = (code >> (BITS - 1 - i)) & 1 ? '#fff' : '#000';
    x.fillRect((i + 2) * B, 0, B, B);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
